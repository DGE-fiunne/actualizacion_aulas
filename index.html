<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <!-- SDK de Supabase -->
  <script src="https://jsdelivr.net"></script>

  <style>
    * { box-sizing: border-box; }
    :root {
      --bg-main: #0f172a; --bg-card: #1e293b; --bg-input: #111827;
      --border-color: rgba(255, 255, 255, 0.08); --text-main: #f8fafc;
      --text-muted: #94a3b8; --accent-green: #22c55e; --radius: 12px;
      --font-body: 'Inter', system-ui, -apple-system, sans-serif; --font-mono: 'IBM Plex Mono', monospace;
    }
    body { font-family: var(--font-body); background: var(--bg-main); color: var(--text-main); margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
    .header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 12px 24px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); border-bottom: 1px solid var(--border-color); gap: 12px; position: sticky; top: 0; z-index: 100; }
    .brand-container { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-container img { height: 40px; width: auto; object-fit: contain; }
    .titulo { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
    .reloj { font-size: 20px; font-weight: 600; font-family: var(--font-mono); color: var(--accent-green); white-space: nowrap; background: rgba(34, 197, 94, 0.1); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(34, 197, 94, 0.2); }
    .container { width: 100%; max-width: 100%; margin: 0 auto; padding: 16px 24px; flex: 1; }
    .seccion-contenedor { background: var(--bg-card); border-radius: var(--radius); overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); border: 1px solid var(--border-color); }
    .panel-seccion { background: var(--bg-input); padding: 16px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; align-items: center; border-bottom: 1px solid var(--border-color); }
    .filter-group { display: flex; flex-direction: column; gap: 6px; }
    .filter-group label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
    select { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 14px; font-family: var(--font-body); background: var(--bg-card); color: var(--text-main); outline: none; transition: all 0.2s ease; cursor: pointer; }
    select:focus { border-color: var(--accent-green); box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2); }
    .table-responsive { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: rgba(255, 255, 255, 0.02); padding: 14px 20px; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border-color); }
    td { padding: 16px 20px; border-bottom: 1px solid var(--border-color); font-size: 14px; vertical-align: middle; }
    tr:hover { background: rgba(255, 255, 255, 0.02); }
    .materia-info { display: flex; flex-direction: column; gap: 2px; }
    .materia-nombre { font-weight: 600; color: var(--text-main); font-size: 15px; }
    .dia-subtitulo { font-size: 12px; color: var(--text-muted); }
    .badge-tipo { display: inline-block; padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
    .badge-clase { background: rgba(245, 145, 39, 0.15); color: #F59127; border: 1px solid rgba(245, 145, 39, 0.3); }
    .badge-examen { background: rgba(42, 157, 143, 0.15); color: #2A9D8F; border: 1px solid rgba(42, 157, 143, 0.3); }
    .badge-contracursada { background: rgba(47, 195, 210, 0.15); color: #2fc3d2; border: 1px solid rgba(47, 195, 210, 0.3); }
    .badge-evento { background: rgba(46, 212, 122, 0.15); color: #2ed47a; border: 1px solid rgba(46, 212, 122, 0.3); }
    .edificio-texto { color: var(--text-muted); font-size: 14px; }
    .aula { background: #2A9D8F; color: #ffffff; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 13px; white-space: nowrap; display: inline-block; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .aula-examen { background: #2ed47a; color: #000000; }
    .aula-contracursada { background: #2fc3d2; color: #000000; }
    .aula-evento { background: #2ed47a; color: #000000; }
    .horario-texto { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--text-main); }
    .sin-resultados { text-align: center; padding: 40px 20px; color: var(--text-muted); font-style: italic; }
    #loader { font-size: 12px; color: var(--accent-green); visibility: hidden; }
    .updating #loader { visibility: visible; }
    .btn-config { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); font-size: 18px; padding: 8px 12px; border-radius: var(--radius); cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; }
    .btn-config:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent-green); transform: rotate(30deg); }

    @media (max-width: 768px) {
      .header { padding: 10px 16px; } .brand-container img { height: 32px; } .titulo { font-size: 13px; } .reloj { font-size: 14px; padding: 4px 10px; } .container { padding: 10px; } .panel-seccion { grid-template-columns: 1fr 1fr; padding: 12px; gap: 10px; } .seccion-contenedor { border-radius: 10px; }
      table, thead, tbody { display: block; width: 100%; } thead { display: none; }
      tr { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "materia tipo" "edificio edificio" "horario aula"; column-gap: 12px; row-gap: 8px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 14px; }
      tr:last-child { border-bottom: none; } td { padding: 0; border-bottom: none; }
      td:nth-child(1) { grid-area: materia; align-self: center; } td:nth-child(1) .materia-nombre { font-size: 14px; } td:nth-child(1) .dia-subtitulo { font-size: 11px; }
      td:nth-child(2) { grid-area: tipo; justify-self: end; align-self: start; } td:nth-child(3) { grid-area: edificio; } td:nth-child(3) .edificio-texto { font-size: 12px; }
      td:nth-child(4) { grid-area: aula; justify-self: end; align-self: center; } td:nth-child(5) { grid-area: horario; align-self: center; }
    }
    @media (max-width: 480px) { .panel-seccion { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand-container">
      <img src="https://iili.io" alt="Logo">
      <div class="titulo" id="txt-header">Distribución de Aulas</div>
    </div>
    <div id="loader">&#10004;</div>
    
    <div style="display: flex; align-items: center; gap: 12px;">
      <button class="btn-config" onclick="abrirModalAdmin()" title="Acceso Administrador">⚙️</button>
      <div class="reloj" id="reloj">--:--</div>
    </div>
  </div>

  <div class="container">
    <div id="cont-aulas" class="seccion-contenedor" style="display:none;">
      <div class="panel-seccion">
        <div class="filter-group">
          <label>Categoría</label>
          <select id="fTipo" onchange="renderizarUI(datosCache)">
            <option value="TODOS">Todas las categorías</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Día</label>
          <select id="fDia" onchange="renderizarUI(datosCache)">
            <option value="TODOS">Todos los días</option>
            <option value="Lunes">Lunes</option><option value="Martes">Martes</option><option value="Miércoles">Miércoles</option>
            <option value="Jueves">Jueves</option><option value="Viernes">Viernes</option><option value="Sábado">Sábado</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Edificio</label>
          <select id="fEdif" onchange="renderizarUI(datosCache)">
            <option value="TODOS">Todos los edificios</option>
            <option value="Central - Av. Las Heras">Central - Av. Las Heras</option>
            <option value="Electromecánica - Av. Castelli">Electromecánica - Av. Castelli</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Turno</label>
          <select id="fTurno" onchange="renderizarUI(datosCache)">
            <option value="TODOS">Todos los turnos</option>
            <option value="MAÑANA">Mañana</option>
            <option value="TARDE">Tarde / Noche</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Materia / Evento</th>
              <th>Categoría</th>
              <th>Edificio</th>
              <th>Aula(s)</th>
              <th>Horario</th>
            </tr>
          </thead>
          <tbody id="tabAulas"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // CREDENCIALES DE CONFIGURACIÓN DE SUPABASE
    const SUPABASE_URL = "https://ardnucavibingeahychm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9Ca20DGAPM8bZHvGUxinaw_lUfEK4TX";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let datosCache = null;

    function actualizarReloj() {
      const ahora = new Date();
      const dias = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
