<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #111827;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #22c55e;
      --radius: 12px;
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }
    body {
      font-family: var(--font-body);
      background: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      padding: 12px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid var(--border-color);
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand-container img {
      height: 40px;
      width: auto;
      object-fit: contain;
    }
    .titulo {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .reloj {
      font-size: 20px;
      font-weight: 600;
      font-family: var(--font-mono);
      color: var(--accent-green);
      white-space: nowrap;
      background: rgba(34, 197, 94, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(34, 197, 94, 0.2);
    }

    .container {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      padding: 16px 24px;
      flex: 1;
    }
    .seccion-contenedor {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
    }
    .panel-seccion {
      background: var(--bg-input);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .filter-group label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 14px;
      font-family: var(--font-body);
      background: var(--bg-card);
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    select:focus {
      border-color: var(--accent-green);
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: rgba(255, 255, 255, 0.02);
      padding: 14px 20px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-color);
    }
    td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
      vertical-align: middle;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .materia-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .materia-nombre {
      font-weight: 600;
      color: var(--text-main);
      font-size: 15px;
    }

    .dia-subtitulo {
      font-size: 12px;
      color: var(--text-muted);
    }

    .badge-tipo {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .badge-clase { background: rgba(245, 145, 39, 0.15); color: #2A9D8F; border: 1px solid rgba(245, 145, 39, 0.3); }
    .badge-examen { background: rgba(42, 157, 143, 0.15); color: #F9F7F3; border: 1px solid rgba(42, 157, 143, 0.15); }
    .badge-contracursada { background: rgba(47, 195, 210, 0.15); color: #2A9D8F; border: 1px solid rgba(47, 195, 210, 0.3); }
    .badge-evento { background: rgba(46, 212, 122, 0.15); color: #2A9D8F; border: 1px solid rgba(46, 212, 122, 0.3); }

    .edificio-texto {
      color: var(--text-muted);
      font-size: 14px;
    }

    .aula {
      background: #2A9D8F;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
      display: inline-block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .aula-examen { background: #2ed47a; color: #000000; }
    .aula-contracursada { background: #2fc3d2; color: #000000; }
    .aula-evento { background: #2ed47a; color: #000000; }
    .horario-texto {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .sin-resultados {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-style: italic;
    }
    #loader {
      font-size: 12px;
      color: var(--accent-green);
      visibility: hidden;
    }

    .updating #loader { visibility: visible; }

    @media (max-width: 768px) {
      .header { padding: 10px 16px; }
      .brand-container img { height: 32px; }
      .titulo { font-size: 13px; }
      .reloj { font-size: 14px; padding: 4px 10px; }
      .container { padding: 10px; }
      .panel-seccion {
        grid-template-columns: 1fr 1fr;
        padding: 12px;
        gap: 10px;
      }
      .seccion-contenedor { border-radius: 10px; }
      
      table, thead, tbody { display: block; width: 100%; }
      thead { display: none; }
      tr {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "materia tipo"
          "edificio edificio"
          "horario aula";
        column-gap: 12px;
        row-gap: 8px;
        background: var(--bg-card);
        border-bottom: 1px solid var(--border-color);
        padding: 14px;
      }
      tr:last-child { border-bottom: none; }
      tr:has(td.sin-resultados) { display: block; }
      td { padding: 0; border-bottom: none; }

      td:nth-child(1) { grid-area: materia; align-self: center; }
      td:nth-child(1) .materia-nombre { font-size: 14px; }
      td:nth-child(1) .dia-subtitulo { font-size: 11px; }
      td:nth-child(2) { grid-area: tipo; justify-self: end; align-self: start; }
      td:nth-child(3) { grid-area: edificio; }
      td:nth-child(3) .edificio-texto { font-size: 12px; }
      td:nth-child(4) { grid-area: aula; justify-self: end; align-self: center; }
      td:nth-child(5) { grid-area: horario; align-self: center; }
    }

    @media (max-width: 480px) {
     .panel-seccion { grid-template-columns: 1fr; }
    }

    .btn-config {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 18px;
      padding: 8px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-config:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent-green);
      transform: rotate(30deg);
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .modal-box h3 {
      margin: 0 0 8px 0;
      font-size: 18px;
      color: var(--text-main);
    }

    .modal-box p {
      margin: 0 0 16px 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    .modal-box input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
      text-align: center;
    }

    .modal-box input[type="password"]:focus {
      border-color: var(--accent-green);
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-modal {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-modal-confirm {
      background: var(--accent-green);
      color: #000;
    }

    .btn-modal-confirm:hover { opacity: 0.9; }

    .btn-modal-cancel {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .btn-modal-cancel:hover { background: rgba(255, 255, 255, 0.05); }

    #msgErrorAdmin {
      color: #ef4444;
      font-size: 12px;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand-container">
      <img src="https://iili.io/ndEnhRj.md.png" alt="Logo">
      <div class="titulo" id="txt-header">Distribución de Aulas</div>
    </div>
    <div id="loader">&#10004</div>
    
    <div style="display: flex; align-items: center; gap: 12px;">
      <button class="btn-config" onclick="abrirModalAdmin()" title="Acceso Administrador">
        ⚙️
      </button>
      <div class="reloj" id="reloj">--:--</div>
    </div>
  </div>

  <div class="container">
    <div id="cont-aulas" class="seccion-contenedor" style="display:none;">
      
      <div class="panel-seccion">
        <div class="filter-group">
          <label>Categoría</label>
          <select id="fTipo">
            <option value="TODOS">Todas las categorías</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Día</label>
          <select id="fDia">
            <option value="TODOS">Todos los días</option>
            <option value="Lunes">Lunes</option>
            <option value="Martes">Martes</option>
            <option value="Miércoles">Miércoles</option>
            <option value="Jueves">Jueves</option>
            <option value="Viernes">Viernes</option>
            <option value="Sábado">Sábado</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Edificio</label>
          <select id="fEdif">
            <option value="TODOS">Todos los edificios</option>
            <option value="Central - Av. Las Heras">Central - Av. Las Heras</option>
            <option value="Electromecánica - Av. Castelli">Electromecánica - Av. Castelli</option>
          </select>
        </div>

        <div class="filter-group">
          <label>Turno</label>
          <select id="fTurno">
            <option value="TODOS">Todos los turnos</option>
            <option value="MAÑANA">Mañana</option>
            <option value="TARDE">Tarde / Noche </option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Materia / Evento</th>
              <th>Categoría</th>
              <th>Edificio</th>
              <th>Aula(s)</th>
              <th>Horario</th>
            </tr>
          </thead>
          <tbody id="tabAulas"></tbody>
        </table>
      </div>

    </div>
  </div>

  <div id="modalAdmin" class="modal-overlay">
    <div class="modal-box">
      <h3>⚙️ Acceso Administrador</h3>
      <p>Ingresá la contraseña para acceder al panel de gestión.</p>
      
      <input type="password" id="passAdminInput" placeholder="Contraseña..." onkeydown="if(event.key==='Enter') abrirModalAdmin()">
      <div id="msgErrorAdmin">Contraseña incorrecta</div>
      
      <div class="modal-buttons">
        <button class="btn-modal btn-modal-cancel" onclick="cerrarModalAdmin()">Cancelar</button>
        <button class="btn-modal btn-modal-confirm" onclick="abrirModalAdmin()">Ingresar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './supabaseClient.js';

    let datosProcesados = [];
    let configGlobal = {};
    let cuatriActivoGlobal = "1";

    function actualizarReloj() {
      const ahora = new Date();
      const dias = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
      let h = ahora.getHours().toString().padStart(2, "0");
      let m = ahora.getMinutes().toString().padStart(2, "0");
      let s = ahora.getSeconds().toString().padStart(2, "0");
      document.getElementById("reloj").innerHTML = `${dias[ahora.getDay()]} ${h}:${m}:${s}`;
    }

    function minutosAHHMM(min) {
      const h = Math.floor(min / 60).toString().padStart(2, "0");
      const m = (min % 60).toString().padStart(2, "0");
      return `${h}:${m}`;
    }

    function extraerRangoHorario(horarioStr) {
      if (!horarioStr) return null;
      const matches = [...horarioStr.matchAll(/(\d{1,2}):(\d{2})/g)];
      if (matches.length === 0) return null;
      const minutos = matches.map(m => parseInt(m[1]) * 60 + parseInt(m[2]));
      return { inicio: Math.min(...minutos), fin: Math.max(...minutos) };
    }

    function cumpleTurno(horarioStr, turnoFiltro) {
      if (turnoFiltro === "TODOS" || !horarioStr) return true;
      const match = horarioStr.match(/(\d{1,2}):(\d{2})/);
      if (!match) return false;
      const h = parseInt(match[1]);
      const min = parseInt(match[2]);
      const totalMinutos = h * 60 + min;

      if (turnoFiltro === "MAÑANA") return (totalMinutos >= 450 && totalMinutos <= 810);
      if (turnoFiltro === "TARDE") return (totalMinutos > 810 && totalMinutos <= 1380);
      return true;
    }

    function procesarYAgruparDatos(lista) {
      const agrupado = {};

      lista.forEach(item => {
        const clave = `${item.materia}-${item.dia}-${item.edificio}-${item.tipo}-${item.horario}`;
        const rango = extraerRangoHorario(item.horario);

        if (!agrupado[clave]) {
          agrupado[clave] = {
            ...item,
            aulas: item.aula ? [item.aula] : [],
            horaInicio: rango ? rango.inicio : null,
            horaFin: rango ? rango.fin : null
          };
        } else {
          if (item.aula && !agrupado[clave].aulas.includes(item.aula)) {
            agrupado[clave].aulas.push(item.aula);
          }
        }
      });

      const ordenDias = { "Lunes": 1, "Martes": 2, "Miércoles": 3, "Jueves": 4, "Viernes": 5, "Sábado": 6, "Domingo": 7 };

      return Object.values(agrupado)
        .map(m => ({
          ...m,
          aulaFormateada: m.aulas.sort().join(" - "),
          horarioTexto: (m.horaInicio !== null && m.horaFin !== null)
            ? `${minutosAHHMM(m.horaInicio)} - ${minutosAHHMM(m.horaFin)}`
            : m.horario
        }))
        .sort((a, b) => {
          const dA = ordenDias[a.dia] || 99;
          const dB = ordenDias[b.dia] || 99;
          if (dA !== dB) return dA - dB;
          return (a.horaInicio ?? 0) - (b.horaInicio ?? 0);
        });
    }

    function obtenerEstiloTipo(tipo) {
      switch (tipo) {
        case "EXAMEN":
          return { claseAula: "aula aula-examen", claseBadge: "badge-tipo badge-examen", textoBadge: "EXAMEN" };
        case "CONTRACURSADA":
          return { claseAula: "aula aula-contracursada", claseBadge: "badge-tipo badge-contracursada", textoBadge: "CONTRACURSADA" };
        case "EVENTO/CAPACITACIÓN":
        case "EVENTO":
          return { claseAula: "aula aula-evento", claseBadge: "badge-tipo badge-evento", textoBadge: "EVENTO" };
        default:
          return { claseAula: "aula", claseBadge: "badge-tipo badge-clase", textoBadge: "CLASE REGULAR" };
      }
    }

    function aplicarFiltros() {
      const tSelTipo = document.getElementById("fTipo").value;
      const dSel = document.getElementById("fDia").value;
      const eSel = document.getElementById("fEdif").value;
      const tSel = document.getElementById("fTurno").value;

      const elemHeader = document.getElementById("txt-header");
      if (elemHeader) {
        const textoCuatri = cuatriActivoGlobal ? ` (${cuatriActivoGlobal}° Cuatrimestre)` : "";
        const textoEdificio = eSel === "TODOS" ? "" : ` - ${eSel}`;
        elemHeader.innerText = `Distribución de Aulas${textoCuatri}${textoEdificio}`;
      }

      // ✅ FILTRADO EXCLUSIVO PARA CLASE_REGULAR
      const filtradas = datosProcesados.filter(m => {
        const cumpleTipo = (tSelTipo === "TODOS" || m.tipo === tSelTipo);
        const cumpleEdif = (eSel === "TODOS" || m.edificio === eSel);
        const cumpleDia  = (dSel === "TODOS" || m.dia === dSel);
        const cumpleTur  = cumpleTurno(m.horario, tSel);

        // El filtro de cuatrimestre SOLAMENTE evalúa a las materias de categoría CLASE_REGULAR
        let cumpleCuatri = true;
        if (m.tipo === "CLASE_REGULAR") {
          cumpleCuatri = (!m.cuatrimestre || String(m.cuatrimestre) === String(cuatriActivoGlobal));
        }

        return cumpleTipo && cumpleEdif && cumpleDia && cumpleTur && cumpleCuatri;
      });

      const tbody = document.getElementById("tabAulas");

      if (filtradas.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="sin-resultados">No hay asignaciones para los filtros seleccionados.</td></tr>`;
        return;
      }

      const html = filtradas.map(m => {
        const estilo = obtenerEstiloTipo(m.tipo);
        return `
          <tr>
            <td>
              <div class="materia-info">
                <span class="materia-nombre">${m.materia}</span>
                <span class="dia-subtitulo">${m.dia}</span>
              </div>
            </td>
            <td><span class="${estilo.claseBadge}">${estilo.textoBadge}</span></td>
            <td><span class="edificio-texto">${m.edificio}</span></td>
            <td><span class="${estilo.claseAula}">AULA ${m.aulaFormateada}</span></td>
            <td><span class="horario-texto">${m.horarioTexto}</span></td>
          </tr>`;
      }).join("");

      tbody.innerHTML = html;
    }

    function armarFiltroTipo(config) {
      const sel = document.getElementById("fTipo");
      if (sel.options.length > 1) return;

      sel.innerHTML = `<option value="TODOS">Todas las categorías</option>`;
      if (config.CLASE_REGULAR !== false) sel.innerHTML += `<option value="CLASE_REGULAR">Clases Regulares</option>`;
      if (config.EXAMEN !== false) sel.innerHTML += `<option value="EXAMEN">Exámenes</option>`;
      if (config.CONTRACURSADA !== false) sel.innerHTML += `<option value="CONTRACURSADA">Contracursadas</option>`;
      if (config["EVENTO/CAPACITACIÓN"] !== false && config.EVENTO !== false) sel.innerHTML += `<option value="EVENTO/CAPACITACIÓN">Eventos / Capacitaciones</option>`;
    }

    async function cargar() {
      document.body.classList.add('updating');

      try {
        const { data: materiasData, error: errMaterias } = await supabase
          .from('distribucion_aulas')
          .select(`
            *,
            materias (nombre),
            edificios (nombre)
          `);

        if (errMaterias) throw errMaterias;

        const { data: configCatData } = await supabase.from('config_categorias').select('*');
        const { data: varData } = await supabase.from('variables_globales').select('valor').eq('clave', 'cuatrimestre_activo').maybeSingle();

        configGlobal = {};
        if (configCatData) {
          configCatData.forEach(row => {
            configGlobal[row.categoria] = row.visible === true || String(row.visible).toLowerCase() === 'true';
          });
        }

        cuatriActivoGlobal = varData ? String(varData.valor) : "1";

        const materiasMapeadas = (materiasData || []).map(m => ({
          id: m.id,
          dia: m.dia,
          materia: m.materias ? m.materias.nombre : (m.materia || 'Evento/Capacitación'),
          edificio: m.edificios ? m.edificios.nombre : '',
          aula: m.aula,
          horario: m.horario || `${m.horario_inicio || ''} - ${m.horario_fin || ''}`,
          tipo: m.categoria,
          cuatrimestre: m.cuatrimestre
        }));

        datosProcesados = procesarYAgruparDatos(materiasMapeadas);

        const hayAlgoHabilitado = Object.values(configGlobal).some(v => v === true);
        document.getElementById("cont-aulas").style.display = hayAlgoHabilitado ? "block" : "none";

        if (hayAlgoHabilitado) {
          armarFiltroTipo(configGlobal);
          aplicarFiltros();
        }
      } catch (err) {
        console.error("Error al cargar los datos desde Supabase:", err);
      } finally {
        document.body.classList.remove('updating');
      }
    }

    function abrirModalAdmin() { window.open("./admin.html", "_blank"); }
    function cerrarModalAdmin() { document.getElementById("modalAdmin").classList.remove("open"); }

    document.getElementById("fTipo").addEventListener("change", aplicarFiltros);
    document.getElementById("fDia").addEventListener("change", aplicarFiltros);
    document.getElementById("fEdif").addEventListener("change", aplicarFiltros);
    document.getElementById("fTurno").addEventListener("change", aplicarFiltros);

    window.abrirModalAdmin = abrirModalAdmin;
    window.cerrarModalAdmin = cerrarModalAdmin;

    window.onload = () => {
      actualizarReloj();
      setInterval(actualizarReloj, 1000);

      cargar();
      setInterval(cargar, 15000);
    };
  </script>
</body>
</html>
